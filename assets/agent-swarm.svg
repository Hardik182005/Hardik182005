<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Live autonomous AI agent swarm</title>
  <desc id="desc">Animated network showing researcher, retriever, reasoner, verifier, guardian, and deployer agents working around a central orchestrator.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset=".5" stop-color="#0b1225"/><stop offset="1" stop-color="#160a28"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <radialGradient id="hub"><stop stop-color="#67e8f9"/><stop offset=".22" stop-color="#2563eb"/><stop offset=".6" stop-color="#7c3aed"/><stop offset="1" stop-color="#020617"/></radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#60a5fa" opacity=".15"/></pattern>
    <filter id="g" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif}.m{font-family:Consolas,'Courier New',monospace}.spin{transform-origin:600px 210px;animation:spin 16s linear infinite}.back{transform-origin:600px 210px;animation:back 10s linear infinite}.pulse{animation:p 1.8s ease-in-out infinite}.blink{animation:b 1s steps(2,end) infinite}.flow{stroke-dasharray:5 12;animation:d 1.7s linear infinite}.card{animation:card 3s ease-in-out infinite}.c2{animation-delay:.4s}.c3{animation-delay:.8s}.c4{animation-delay:1.2s}.c5{animation-delay:1.6s}.c6{animation-delay:2s}
      @keyframes spin{to{transform:rotate(360deg)}}@keyframes back{to{transform:rotate(-360deg)}}@keyframes p{0%,100%{opacity:.45}50%{opacity:1}}@keyframes b{50%{opacity:.2}}@keyframes d{to{stroke-dashoffset:-34}}@keyframes card{0%,100%{filter:none}50%{filter:drop-shadow(0 0 6px #22d3ee)}}
    </style>
  </defs>
  <rect width="1200" height="390" rx="26" fill="url(#bg2)"/>
  <rect width="1200" height="390" rx="26" fill="url(#dots)"/>
  <rect x="1.5" y="1.5" width="1197" height="387" rx="25" fill="none" stroke="url(#beam)" stroke-width="3" opacity=".55"/>
  <text x="38" y="42" fill="#e2e8f0" font-size="21" font-weight="800" letter-spacing="3">LIVE AUTONOMOUS AGENT SWARM</text>
  <circle cx="782" cy="35" r="5" fill="#34d399" class="blink" filter="url(#g)"/>
  <text x="797" y="40" fill="#6ee7b7" font-size="11" class="m">ORCHESTRATION ACTIVE</text>
  <text x="1160" y="40" fill="#64748b" font-size="11" text-anchor="end" class="m">TRACE #HH-AI-2026</text>
  <path d="M38 57H1162" stroke="#334155"/>

  <g fill="none" stroke-width="2">
    <path id="p1" class="flow" d="M600 210C480 116 338 100 214 126" stroke="#22d3ee" opacity=".65"/>
    <path id="p2" class="flow" d="M600 210C450 210 342 210 214 210" stroke="#60a5fa" opacity=".65"/>
    <path id="p3" class="flow" d="M600 210C480 304 338 322 214 294" stroke="#a78bfa" opacity=".65"/>
    <path id="p4" class="flow" d="M600 210C720 116 862 100 986 126" stroke="#f472b6" opacity=".65"/>
    <path id="p5" class="flow" d="M600 210C750 210 858 210 986 210" stroke="#c084fc" opacity=".65"/>
    <path id="p6" class="flow" d="M600 210C720 304 862 322 986 294" stroke="#34d399" opacity=".65"/>
  </g>

  <g filter="url(#g)">
    <circle r="4" fill="#fff"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
    <circle r="4" fill="#fff"><animateMotion dur="2s" begin="-.8s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
    <circle r="4" fill="#fff"><animateMotion dur="2.8s" begin="-.3s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
    <circle r="4" fill="#fff"><animateMotion dur="2.3s" begin="-.5s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>
    <circle r="4" fill="#fff"><animateMotion dur="2.6s" begin="-1.1s" repeatCount="indefinite"><mpath href="#p5"/></animateMotion></circle>
    <circle r="4" fill="#fff"><animateMotion dur="2.2s" begin="-.7s" repeatCount="indefinite"><mpath href="#p6"/></animateMotion></circle>
  </g>

  <g>
    <circle cx="600" cy="210" r="98" fill="none" stroke="#22d3ee" stroke-opacity=".18"/>
    <circle cx="600" cy="210" r="84" fill="none" stroke="#818cf8" stroke-dasharray="2 11" class="spin"/>
    <circle cx="600" cy="210" r="70" fill="none" stroke="#c084fc" stroke-dasharray="14 8" opacity=".55" class="back"/>
    <circle cx="600" cy="210" r="58" fill="url(#hub)" filter="url(#g)" class="pulse"/>
    <path d="M580 207c0-13 9-23 21-23 10 0 18 6 21 16 8 2 13 9 13 17 0 10-8 18-18 19h-31c-11 0-19-8-19-19 0-9 5-17 13-20" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
    <text x="600" y="266" fill="#e0f2fe" font-size="12" font-weight="800" text-anchor="middle" class="m">ORCHESTRATOR</text>
  </g>

  <g class="card">
    <rect x="44" y="92" width="170" height="68" rx="13" fill="#071827" stroke="#22d3ee" stroke-opacity=".62"/>
    <circle cx="64" cy="112" r="6" fill="#22d3ee" class="pulse"/><text x="78" y="117" fill="#a5f3fc" font-size="14" font-weight="800">RESEARCHER</text>
    <text x="64" y="140" fill="#64748b" font-size="10" class="m">LIVE SOURCES • RAG</text><text x="194" y="140" fill="#34d399" font-size="10" text-anchor="end" class="m">READY</text>
  </g>
  <g class="card c2">
    <rect x="44" y="176" width="170" height="68" rx="13" fill="#091426" stroke="#60a5fa" stroke-opacity=".62"/>
    <circle cx="64" cy="196" r="6" fill="#60a5fa" class="pulse"/><text x="78" y="201" fill="#bfdbfe" font-size="14" font-weight="800">RETRIEVER</text>
    <text x="64" y="224" fill="#64748b" font-size="10" class="m">VECTOR • SQL</text><text x="194" y="224" fill="#34d399" font-size="10" text-anchor="end" class="m">READY</text>
  </g>
  <g class="card c3">
    <rect x="44" y="260" width="170" height="68" rx="13" fill="#100f27" stroke="#a78bfa" stroke-opacity=".62"/>
    <circle cx="64" cy="280" r="6" fill="#a78bfa" class="pulse"/><text x="78" y="285" fill="#ddd6fe" font-size="14" font-weight="800">REASONER</text>
    <text x="64" y="308" fill="#64748b" font-size="10" class="m">PLAN • TOOL USE</text><text x="194" y="308" fill="#34d399" font-size="10" text-anchor="end" class="m">READY</text>
  </g>
  <g class="card c4">
    <rect x="986" y="92" width="170" height="68" rx="13" fill="#160d20" stroke="#f472b6" stroke-opacity=".62"/>
    <circle cx="1006" cy="112" r="6" fill="#f472b6" class="pulse"/><text x="1020" y="117" fill="#fbcfe8" font-size="14" font-weight="800">VERIFIER</text>
    <text x="1006" y="140" fill="#64748b" font-size="10" class="m">CITATIONS • EVALS</text><text x="1136" y="140" fill="#34d399" font-size="10" text-anchor="end" class="m">PASS</text>
  </g>
  <g class="card c5">
    <rect x="986" y="176" width="170" height="68" rx="13" fill="#130f25" stroke="#c084fc" stroke-opacity=".62"/>
    <circle cx="1006" cy="196" r="6" fill="#c084fc" class="pulse"/><text x="1020" y="201" fill="#e9d5ff" font-size="14" font-weight="800">GUARDIAN</text>
    <text x="1006" y="224" fill="#64748b" font-size="10" class="m">POLICY • SAFETY</text><text x="1136" y="224" fill="#34d399" font-size="10" text-anchor="end" class="m">ARMED</text>
  </g>
  <g class="card c6">
    <rect x="986" y="260" width="170" height="68" rx="13" fill="#071b1a" stroke="#34d399" stroke-opacity=".62"/>
    <circle cx="1006" cy="280" r="6" fill="#34d399" class="pulse"/><text x="1020" y="285" fill="#a7f3d0" font-size="14" font-weight="800">DEPLOYER</text>
    <text x="1006" y="308" fill="#64748b" font-size="10" class="m">CLOUD • OBSERVE</text><text x="1136" y="308" fill="#34d399" font-size="10" text-anchor="end" class="m">LIVE</text>
  </g>

  <g transform="translate(430 342)">
    <rect width="340" height="26" rx="13" fill="#07111f" stroke="#334155"/>
    <text x="17" y="18" fill="#64748b" font-size="10" class="m">INPUT</text><text x="67" y="18" fill="#67e8f9" font-size="10" class="m">→ PLAN → RETRIEVE → VERIFY → SHIP</text>
    <rect x="66" y="22" width="230" height="2" fill="url(#beam)"><animate attributeName="width" values="0;230;0" dur="3s" repeatCount="indefinite"/></rect>
  </g>
</svg>

