<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Hardik Hinduja — AI Engineer cyber command center</title>
  <desc id="desc">Animated cyberpunk interface with a pulsing AI core, data streams, and Hardik Hinduja AI Engineer title.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/><stop offset=".52" stop-color="#0b1026"/><stop offset="1" stop-color="#120724"/>
    </linearGradient>
    <linearGradient id="cyanViolet" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22d3ee"/><stop offset=".52" stop-color="#60a5fa"/><stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="45%" r="58%">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".14" stop-color="#67e8f9"/><stop offset=".45" stop-color="#2563eb"/><stop offset=".78" stop-color="#7c3aed"/><stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#22d3ee" stroke-opacity=".09" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.4" fill="#a78bfa" fill-opacity=".22"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <clipPath id="clip"><rect width="1200" height="480" rx="28"/></clipPath>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif}.mono{font-family:Consolas,'Courier New',monospace}
      .grid{animation:gridShift 7s linear infinite}.orbit{transform-origin:260px 241px;animation:spin 12s linear infinite}.orbit2{transform-origin:260px 241px;animation:spinBack 8s linear infinite}
      .pulse{animation:pulse 2s ease-in-out infinite}.blink{animation:blink 1.1s steps(2,end) infinite}.dash{stroke-dasharray:8 15;animation:dash 2s linear infinite}
      .dashSlow{stroke-dasharray:4 12;animation:dash 4s linear infinite}.glitch1{animation:glitch1 4s steps(1,end) infinite}.glitch2{animation:glitch2 4s steps(1,end) infinite}
      .bar1{animation:bar 2.1s ease-in-out infinite}.bar2{animation:bar 1.7s ease-in-out .2s infinite}.bar3{animation:bar 2.4s ease-in-out .4s infinite}
      @keyframes gridShift{to{transform:translateY(42px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinBack{to{transform:rotate(-360deg)}}
      @keyframes pulse{0%,100%{opacity:.5;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}@keyframes blink{50%{opacity:.15}}@keyframes dash{to{stroke-dashoffset:-46}}
      @keyframes glitch1{0%,91%,100%{transform:translate(0);opacity:0}92%{transform:translate(7px,-2px);opacity:.65}94%{transform:translate(-4px,2px);opacity:.4}96%{opacity:0}}
      @keyframes glitch2{0%,87%,100%{transform:translate(0);opacity:0}88%{transform:translate(-6px,2px);opacity:.45}90%{transform:translate(4px,-1px);opacity:.3}92%{opacity:0}}
      @keyframes bar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="480" fill="url(#bg)"/>
    <circle cx="265" cy="235" r="220" fill="#2563eb" opacity=".12" filter="url(#soft)"/>
    <circle cx="995" cy="145" r="210" fill="#9333ea" opacity=".10" filter="url(#soft)"/>
    <rect class="grid" x="0" y="-42" width="1200" height="564" fill="url(#grid)"/>
    <path d="M0 390 C220 342 370 450 603 382 S983 328 1200 365V480H0Z" fill="#22d3ee" opacity=".035"/>
    <rect x="1.5" y="1.5" width="1197" height="477" rx="27" fill="none" stroke="url(#cyanViolet)" stroke-width="3" opacity=".72"/>
    <path d="M24 76V24H76M1124 24h52v52M24 404v52h52M1176 404v52h-52" fill="none" stroke="#67e8f9" stroke-width="3" filter="url(#glow)"/>

    <g opacity=".62">
      <path class="dash" d="M26 106H148L183 141" fill="none" stroke="#22d3ee" stroke-width="2"/>
      <path class="dashSlow" d="M26 364H126L180 310" fill="none" stroke="#a78bfa" stroke-width="2"/>
      <path class="dash" d="M454 90H520L557 127H670" fill="none" stroke="#60a5fa" stroke-width="2"/>
      <circle cx="184" cy="141" r="4" fill="#22d3ee" class="pulse"/><circle cx="181" cy="310" r="4" fill="#c084fc" class="pulse"/>
    </g>

    <g>
      <circle cx="260" cy="241" r="150" fill="none" stroke="#22d3ee" stroke-opacity=".18"/>
      <circle cx="260" cy="241" r="122" fill="none" stroke="#a78bfa" stroke-opacity=".23" stroke-dasharray="3 10" class="orbit2"/>
      <g class="orbit">
        <ellipse cx="260" cy="241" rx="155" ry="72" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="10 12" opacity=".75"/>
        <circle cx="105" cy="241" r="7" fill="#22d3ee" filter="url(#glow)"/><circle cx="415" cy="241" r="5" fill="#c084fc" filter="url(#glow)"/>
      </g>
      <g class="orbit2">
        <ellipse cx="260" cy="241" rx="76" ry="156" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5 14" opacity=".72" transform="rotate(28 260 241)"/>
        <circle cx="301" cy="99" r="6" fill="#a78bfa" filter="url(#glow)"/>
      </g>
      <circle cx="260" cy="241" r="88" fill="url(#core)" opacity=".92" class="pulse" filter="url(#glow)"/>
      <circle cx="260" cy="241" r="46" fill="#020617" stroke="#a5f3fc" stroke-width="2"/>
      <path d="M236 248c0-16 11-29 25-29 12 0 22 8 25 20 9 3 15 11 15 21 0 12-9 22-21 23h-37c-13 0-23-10-23-23 0-11 6-20 16-24" fill="none" stroke="url(#cyanViolet)" stroke-width="5" stroke-linecap="round"/>
      <path d="M245 235v39M260 226v57M276 236v38" stroke="#67e8f9" stroke-width="3" stroke-linecap="round" opacity=".85"/>
      <circle cx="245" cy="248" r="3" fill="#fff"/><circle cx="260" cy="240" r="3" fill="#fff"/><circle cx="276" cy="252" r="3" fill="#fff"/>
      <text x="260" y="342" fill="#a5f3fc" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="4" class="mono">NEURAL CORE ONLINE</text>
      <text x="260" y="365" fill="#64748b" font-size="11" text-anchor="middle" class="mono">AGENTS: 08  •  GUARDRAILS: ACTIVE</text>
    </g>

    <g>
      <rect x="510" y="52" width="150" height="28" rx="14" fill="#22d3ee" fill-opacity=".09" stroke="#22d3ee" stroke-opacity=".55"/>
      <circle cx="529" cy="66" r="5" fill="#34d399" class="blink" filter="url(#glow)"/>
      <text x="542" y="71" fill="#a5f3fc" font-size="12" font-weight="700" class="mono">SYSTEM ONLINE</text>
      <text x="510" y="121" fill="#94a3b8" font-size="18" font-weight="650" letter-spacing="7">HARDIK HINDUJA</text>
      <text class="glitch1" x="506" y="201" fill="#22d3ee" font-size="76" font-weight="900" letter-spacing="2" opacity="0">AI ENGINEER</text>
      <text class="glitch2" x="516" y="201" fill="#f472b6" font-size="76" font-weight="900" letter-spacing="2" opacity="0">AI ENGINEER</text>
      <text x="510" y="201" fill="url(#cyanViolet)" font-size="76" font-weight="900" letter-spacing="2">AI ENGINEER</text>
      <rect x="512" y="218" width="612" height="3" rx="2" fill="url(#cyanViolet)" opacity=".9"/>
      <rect x="512" y="218" width="120" height="3" fill="#fff" filter="url(#glow)"><animate attributeName="x" values="512;1004;512" dur="3.2s" repeatCount="indefinite"/></rect>
      <text x="512" y="255" fill="#e2e8f0" font-size="20" font-weight="700" letter-spacing="3">AGENTIC SYSTEMS ARCHITECT</text>
      <text x="512" y="286" fill="#67e8f9" font-size="14" letter-spacing="2.2" class="mono">RAG // MULTI-AGENT // FINTECH // SRE</text>
      <text x="512" y="324" fill="#94a3b8" font-size="13" class="mono">BUILDING TRUSTWORTHY AI THAT SHIPS.</text>

      <g transform="translate(512 352)">
        <rect width="188" height="52" rx="12" fill="#071426" stroke="#22d3ee" stroke-opacity=".36"/>
        <text x="16" y="20" fill="#64748b" font-size="10" class="mono">HACKATHON STATUS</text><text x="16" y="40" fill="#fbbf24" font-size="17" font-weight="800">4× WINNER</text>
      </g>
      <g transform="translate(714 352)">
        <rect width="188" height="52" rx="12" fill="#0d1025" stroke="#a78bfa" stroke-opacity=".4"/>
        <text x="16" y="20" fill="#64748b" font-size="10" class="mono">INNOVAHACK</text><text x="16" y="40" fill="#c4b5fd" font-size="17" font-weight="800">4× FINALIST</text>
      </g>
      <g transform="translate(916 352)">
        <rect width="208" height="52" rx="12" fill="#10101d" stroke="#f472b6" stroke-opacity=".38"/>
        <text x="16" y="20" fill="#64748b" font-size="10" class="mono">IIM BANGALORE</text><text x="16" y="40" fill="#f9a8d4" font-size="17" font-weight="800">VENIX 2026</text>
      </g>
    </g>

    <g transform="translate(1090 82)" fill="#22d3ee" opacity=".7">
      <rect class="bar1" x="0" y="0" width="5" height="25" rx="2" transform-origin="2.5px 25px"/><rect class="bar2" x="10" y="0" width="5" height="25" rx="2" transform-origin="12.5px 25px"/><rect class="bar3" x="20" y="0" width="5" height="25" rx="2" transform-origin="22.5px 25px"/>
    </g>
    <rect y="0" width="1200" height="2" fill="#fff" opacity=".3"><animate attributeName="y" values="0;478;0" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.28;0" dur="7s" repeatCount="indefinite"/></rect>
  </g>
</svg>

