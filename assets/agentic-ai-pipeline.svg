<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Animated agentic AI delivery pipeline</title>
  <desc id="desc">Data flows through retrieval, reasoning, guardrails and cloud deployment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset="1" stop-color="#110827"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <filter id="g" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .head{font:700 19px 'Segoe UI',Arial,sans-serif;letter-spacing:2px;fill:#e6faff}
    .name{font:700 16px 'Segoe UI',Arial,sans-serif;fill:#e2e8f0}
    .sub{font:500 12px 'Cascadia Code',monospace;fill:#94a3b8}
    .box{fill:#0b1224;stroke:#334155;stroke-width:1.5}
    .active{animation:active 2.5s ease-in-out infinite}
    @keyframes active{50%{stroke:#22d3ee;filter:drop-shadow(0 0 7px #22d3ee)}}
  </style>
  <rect width="1200" height="250" rx="24" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="247" rx="22.5" fill="none" stroke="url(#line)" stroke-width="3"/>
  <text x="42" y="42" class="head">AGENTIC AI DELIVERY PIPELINE // LIVE</text>
  <text x="914" y="42" class="sub">latency: optimized  •  trust: enforced</text>

  <path id="rail" d="M185 125H1015" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
  <path d="M185 125H1015" stroke="url(#line)" stroke-width="2" stroke-dasharray="8 13">
    <animate attributeName="stroke-dashoffset" from="0" to="-42" dur="2.2s" repeatCount="indefinite"/>
  </path>

  <g transform="translate(36 80)" class="active"><rect class="box" width="170" height="92" rx="16"/><text x="85" y="38" text-anchor="middle" class="name">LIVE DATA</text><text x="85" y="61" text-anchor="middle" class="sub">markets • docs • APIs</text></g>
  <g transform="translate(276 80)" class="active" style="animation-delay:.35s"><rect class="box" width="170" height="92" rx="16"/><text x="85" y="38" text-anchor="middle" class="name">RAG ENGINE</text><text x="85" y="61" text-anchor="middle" class="sub">retrieve • cite • verify</text></g>
  <g transform="translate(516 80)" class="active" style="animation-delay:.7s"><rect class="box" width="170" height="92" rx="16"/><text x="85" y="38" text-anchor="middle" class="name">AGENT CORE</text><text x="85" y="61" text-anchor="middle" class="sub">plan • reason • execute</text></g>
  <g transform="translate(756 80)" class="active" style="animation-delay:1.05s"><rect class="box" width="170" height="92" rx="16"/><text x="85" y="38" text-anchor="middle" class="name">GUARDRAILS</text><text x="85" y="61" text-anchor="middle" class="sub">policy • evals • safety</text></g>
  <g transform="translate(996 80)" class="active" style="animation-delay:1.4s"><rect class="box" width="170" height="92" rx="16"/><text x="85" y="38" text-anchor="middle" class="name">SHIP</text><text x="85" y="61" text-anchor="middle" class="sub">cloud • observe • scale</text></g>

  <g fill="#67e8f9" filter="url(#g)">
    <circle r="6"><animateMotion dur="4.2s" repeatCount="indefinite" path="M185 125H1015"/></circle>
    <circle r="5"><animateMotion begin="1.4s" dur="4.2s" repeatCount="indefinite" path="M185 125H1015"/></circle>
    <circle r="4"><animateMotion begin="2.8s" dur="4.2s" repeatCount="indefinite" path="M185 125H1015"/></circle>
  </g>
  <g fill="#a78bfa">
    <circle cx="121" cy="207" r="4"><animate attributeName="opacity" values=".2;1;.2" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="151" cy="207" r="4"><animate attributeName="opacity" values="1;.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="181" cy="207" r="4"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle>
  </g>
  <text x="211" y="212" class="sub">evidence grounded • deterministic where it matters • production monitored</text>
</svg>

